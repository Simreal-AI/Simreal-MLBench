[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-benchmark-sdk"
version = "0.3.0"
description = "Public ML benchmark catalog, research-agent client and reference scoring"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mleb = "mle_benchmark.cli:main"
mleb-remote = "mle_benchmark.remote_client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
